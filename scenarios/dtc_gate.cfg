# dtc_gate.cfg -- GATE-3D-A1's pinned scenario (reports/2026-07-04-vizdoom-3d-floor-design.md
# AMENDMENT A1.3). Uses the STOCK defend_the_center.wad shipped inside the vizdoom==1.3.0 package --
# no .wad is committed to this repo. core/vizdoom_world.VizdoomWorld.__init__ resolves the wad path
# explicitly via `game.set_doom_scenario_path(os.path.join(vzd.scenarios_path, "defend_the_center.wad"))`
# AFTER load_config(this file) -- so the `doom_scenario_path` key below is documentation only and is
# always overridden by the adapter (avoids depending on ViZDoom's relative-path resolution rules for a
# cfg that lives outside its own scenarios/ directory).
#
# Re-pin history: this scenario REPLACES the original basic_gate.cfg design (design doc S2.1) after
# PC-1 FAILED (runs/vizdoom_precheck/PRECHECK_REPORT.md) -- basic.wad's standing Cacodemon produces
# ZERO frame-diff on ego-stationary pairs (idle sprite, doesn't animate until hit), so P2's mover
# channel was structurally blind to it. defend_the_center's monsters WALK toward the player, which is
# the regime the design's S1.3 mover-viability analysis actually measured.

doom_scenario_path = defend_the_center.wad
doom_map = map01

# Action grain is pinned OUTSIDE this cfg (core/vizdoom_world.py TICS_PER_STEP=4, FIXED) -- every
# make_action call ticks 4 frames regardless of what's set here; episode_timeout below is in TICS.
episode_timeout = 1000

# available_buttons: dtc's native set, no strafes/no translation (AMENDMENT A1.3) -- this is what
# makes "ego-stationary" reduce to "not turning" for P2's gate.
available_buttons =
    {
        TURN_LEFT
        TURN_RIGHT
        ATTACK
    }

# available_game_variables: HEALTH + AMMO2 are defend_the_center's defaults; KILLCOUNT is added
# explicitly (probe fact, PRECHECK_REPORT.md: dtc's default cfg does NOT expose KILLCOUNT). All three
# are the ORACLE -- scoring only, logged server-side to oracle.jsonl by world_mcp's session class,
# NEVER placed on the MCP wire (no-leak law, design S3.3).
available_game_variables =
    {
        HEALTH
        AMMO2
        KILLCOUNT
    }

# Screen pinned RGB24 / 320x240 in code (core/vizdoom_world.py sets these via the API, not this file,
# so a stale cfg value here can never silently disagree with what the adapter actually requests) --
# left unset here deliberately; VizdoomWorld.__init__ calls set_screen_format/set_screen_resolution
# AFTER load_config, which is authoritative.
window_visible = false
sound_enabled = false

# The episode also ends on player death (melee overwhelm / ammo exhaustion -- dtc ships 26 pistol
# rounds by default); ViZDoom's default death-termination behavior applies (no override needed).
