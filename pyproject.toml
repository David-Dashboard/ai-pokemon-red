[project]
name = "ai-pokemon-red"
version = "0.1.0"
description = "Let an AI agent play Pokémon Red through a tool-call gateway (Arena world plugin)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyboy>=2.0",   # Game Boy emulator (drives the actual game)
    "pillow>=9.0",  # screenshot saving (Observation screen_path)
    "numpy>=1.21",  # PyBoy dependency / state arrays
    "requests>=2.25",  # LLMButtonBrain -> Ollama HTTP API (only for --brain llm)
    "imageio>=2.37.3",       # MP4 recording (--record); ffmpeg below is bundled, no system install
    "imageio-ffmpeg>=0.6.0",
]

# PEP 735 dependency group; `uv sync` installs it by default.
[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=7.0",
]

[tool.uv]
# This is an application, not a library — don't try to build/install the repo
# itself as a wheel; just manage its environment and dependencies.
package = false

[tool.pytest.ini_options]
# reports/_archive/embodiment-stone-layer-v0.2/ vendors a REFERENCE-ONLY copy of an
# external contract scaffold (ADR-003) that happens to ship its own tests/ package.
# Without this, pytest's rootdir-relative import resolves its tests/test_contract_frozen.py
# to the same dotted module name as this repo's tests/test_contract_frozen.py and aborts
# collection repo-wide ("import file mismatch"). Exclude the vendored tree; it is not
# wired into this repo's test suite.
#
# reports/probes/ holds one-off investigation scripts kept as evidence artifacts, not
# suite tests. They are written ad-hoc, hardcode absolute paths, and boot emulators at
# import time, so pytest importing one is actively destructive: 2026-07-28-mkds-lap-oracle/
# poke_test.py matched the default *_test.py pattern, and on import it sys.path.insert'd
# the primary checkout ahead of the worktree and booted DeSmuME, poisoning core.nds_emulator
# and breaking tests/test_nds_touch_drag.py repo-wide. Probe dirs keep accumulating; exclude
# the whole tree rather than policing 60+ ad-hoc filenames.
norecursedirs = [
    "reports/_archive/embodiment-stone-layer-v0.2",
    "games/pokemon_red/_archive",
    "reports/probes",
]
