<!doctype html><meta charset=utf-8><title>Reach-gameplay labeler</title>
<style>
 body{font:14px system-ui;background:#111;color:#ddd;margin:0;padding:16px}
 h1{font-size:16px} .bar{position:sticky;top:0;background:#111;padding:8px 0;z-index:9}
 .card{border:1px solid #333;border-radius:8px;margin:10px 0;padding:8px;background:#181818}
 .meta{color:#999;font-size:12px;margin:2px 0 6px}
 .strip{overflow-x:auto;white-space:nowrap;background:#000;border:1px solid #222}
 .strip img{image-rendering:pixelated;height:170px}
 .btns button{margin:6px 6px 0 0;padding:6px 10px;border:1px solid #444;border-radius:6px;background:#222;color:#ddd;cursor:pointer}
 .btns button.sel{outline:2px solid #6f6;background:#143}
 .gameplay{color:#6f6}.det{color:#fc6}
 button#exp{background:#235;padding:8px 14px}
</style>
<div class=bar><h1>Reach-gameplay labeler &mdash; <span id=prog></span>
  <button id=exp>Export reach_labels.json</button></h1>
  <div class=meta>One click per game. <b>gameplay</b> = the run truly reached a controllable scene.
  Others = where it actually got stuck. Judge from the STRIP (left&rarr;right = the run over time);
  a looping/animated title that the detector greened as "gameplay" is a false positive.</div>
</div>
<div id=list></div>

const CLASSES = ["gameplay","title","menu","dialog","loading","blank","ambiguous"];
const KEY="reach_labels_v1";
let labels = JSON.parse(localStorage.getItem(KEY)||"{}");
function save(){localStorage.setItem(KEY,JSON.stringify(labels));prog();}
function prog(){document.getElementById('prog').textContent =
  Object.keys(labels).length+" / "+GAMES.length+" labeled";}
function pick(rom,c){labels[rom]=c;save();render();}
function render(){
 const L=document.getElementById('list');L.innerHTML="";
 for(const g of GAMES){
   const d=document.createElement('div');d.className='card';
   const det = g.reached? `<span class=gameplay>reached</span>`:`not-reached`;
   const modes = Object.entries(g.modes||{}).map(([k,v])=>k[0]+v).join(' ');
   d.innerHTML = `<b>${g.rom}</b> <span class=meta>[${g.console}${g.held_out?' &middot; held-out':''}]</span>
     <div class=meta>detector: ${det} &middot; first_gp=${g.first_gameplay} &middot; steps=${g.steps} &middot; <span class=det>${modes}</span></div>
     <div class=strip><img src="strips/${g.strip}"></div>
     <div class=btns>`+CLASSES.map(c=>`<button data-c="${c}" class="${labels[g.rom]===c?'sel':''}">${c}</button>`).join('')+`</div>`;
   d.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(g.rom,b.dataset.c));
   L.appendChild(d);
 }
}
document.getElementById('exp').onclick=()=>{
 const out=GAMES.map(g=>({console:g.console,rom:g.rom,held_out:g.held_out,
   detector_reached:g.reached,label:labels[g.rom]||null,truth_reached:labels[g.rom]==="gameplay"}));
 const b=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download="reach_labels.json";a.click();
};
prog();render();
</script>
